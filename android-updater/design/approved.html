<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revamped Updater — approved B layout with A colors</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17151e;color:#ffe3c3;font:16px/1.5 system-ui,sans-serif}main{max-width:1740px;margin:auto;padding:32px 24px}h1{font-size:26px;margin:0 0 8px}main>p{color:#a9b5aa;margin:0 0 28px}.screens{display:grid;grid-template-columns:repeat(4,minmax(290px,1fr));gap:22px}.screen-label{font-size:15px;margin:0 0 10px;color:#a9b5aa}.phone{height:780px;background:#242032;border:1px solid #574d5b;border-radius:20px;padding:24px;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:8px;margin-bottom:24px}.top h2{font-size:22px;font-weight:600;margin:0;flex:1}.refresh,.change{background:transparent;border:0;color:#fc7580;min-width:48px;min-height:48px;font:inherit;cursor:pointer}.refresh{font-size:28px}.banner{padding:18px;background:#34453f;border-radius:14px}.banner p{font-size:15px;margin:0;color:#e0e2d5}.banner h3{font-size:25px;line-height:1.2;margin:12px 0;font-weight:600}.versions{display:flex;gap:12px;margin-top:20px}.card{flex:1;background:#302c40;border-radius:12px;padding:14px}.label{font-size:14px;color:#a9b5aa;margin:0}.number{font-size:26px;margin:6px 0 0;font-weight:600}.latest .number{color:#fc7580}.changes{flex:1;padding-top:24px;overflow:auto}.changes h3{font-size:19px;margin:0 0 12px}.changes p,.changes li{font-size:16px;color:#e3d8cf}.changes ul{padding-left:19px}.changes li{margin-bottom:12px}.folder{display:flex;align-items:center;border-top:1px solid #574d5b;padding-top:10px;margin-top:16px;gap:8px}.folder div{flex:1}.folder p{margin:2px 0}.action{margin-top:12px;width:100%;min-height:56px;border:0;border-radius:6px;background:#fc525f;color:#242032;font:600 17px system-ui;cursor:pointer}.foot{font-size:14px;text-align:center;color:#a9b5aa;margin:12px 0 0}button:focus-visible{outline:3px solid #ffe3c3;outline-offset:2px}@media(max-width:1300px){.screens{grid-template-columns:repeat(2,minmax(290px,1fr))}}@media(max-width:680px){.screens{grid-template-columns:1fr}.phone{max-width:430px;margin:auto}main{padding:24px 16px}}
</style>
<main><h1>Revamped Updater</h1><p>Approved direction B with A colors. Interactive design previews; deployment happens in the native Android client.</p><section class="screens" id="screens"></section></main>
<script>
const states=[
{name:'First connection',title:'Connect your game',status:'Connect DroidDeck once. The game folder is found automatically.',installed:'—',latest:'—',action:'Connect DroidDeck',notes:['Choose DroidDeck in Android Files and allow folder access.','The updater finds and remembers the installed game.']},
{name:'Update available',title:'Ready to update',status:'Package verified. Close the game in DroidDeck before deploying.',installed:'1.1.2',latest:'1.1.3',action:'Install 1.1.3',notes:['Character previews initialize immediately.','Charge Cannon, Gale and Bulwark have complete controller navigation.']},
{name:'Update complete',title:'You’re up to date',status:'Update verified. Open DroidDeck to play.',installed:'1.1.3',latest:'1.1.3',action:'Open DroidDeck',notes:['The installed release was read back and verified.','Your saves and settings were preserved.']},
{name:'Interrupted update',title:'Finish your update',status:'The previous update has not finished. Resume its recorded deployment.',installed:'1.1.2',latest:'1.1.3',action:'Finish interrupted update',notes:['The verified update and original files are retained until deployment completes.','Finish this update before choosing another folder.']}
];
for(const state of states){const article=document.createElement('article');article.innerHTML=`<p class="screen-label">${state.name}</p><div class="phone"><div class="top"><h2>Revamped Updater</h2><button class="refresh" aria-label="Preview checking GitHub">↻</button></div><div class="banner"><p>20 Minutes Till Dawn</p><h3>${state.title}</h3><p class="status">${state.status}</p></div><div class="versions"><div class="card"><p class="label">Installed</p><p class="number">${state.installed}</p></div><div class="card latest"><p class="label">Latest</p><p class="number">${state.latest}</p></div></div><div class="changes"><h3>What’s new</h3><ul>${state.notes.map(note=>`<li>${note}</li>`).join('')}</ul></div><div class="folder"><div><p class="label">DroidDeck</p><p>${state.installed==='—'?'Not connected':'20MinuteTillDawn'}</p></div><button class="change">${state.installed==='—'?'Connect':'Change'}</button></div><button class="action">${state.action}</button><p class="foot">Updates are manual. Your saves stay in place.</p></div>`;article.querySelector('.action').onclick=()=>{article.querySelector('.status').textContent='Preview only: this action runs in the Android client.'};article.querySelector('.refresh').onclick=()=>{article.querySelector('.status').textContent='Preview: the latest release is 1.1.3.'};article.querySelector('.change').onclick=()=>{article.querySelector('.status').textContent='Preview: Android opens the DroidDeck folder-access prompt.'};document.querySelector('#screens').append(article);}
</script></html>
